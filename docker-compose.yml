services:
  postgres:
    image: postgres:16-alpine
    container_name: revflow-postgres
    environment:
      POSTGRES_USER: revflow
      POSTGRES_PASSWORD: revflow
      POSTGRES_DB: revflow
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U revflow -d revflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: revflow-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:

